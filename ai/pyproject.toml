[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tichu-ai"
version = "0.1.0"
description = "Tichu self-play simulator and training loop (Milestone 2)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "torch",
    "onnx",
    "onnxruntime",
    "boto3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["tichu_env*", "agents*", "training*", "eval*", "export*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
